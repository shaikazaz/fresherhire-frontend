<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresher Jobs | FresherHire</title><meta name="description" content="Browse fresher and junior jobs on FresherHire."><link rel="canonical" href="{{ site_url }}/seo/jobs/"></head><body><main><h1>Fresher Jobs</h1><p>Search-friendly public job listings from FresherHire.</p>{% for job in jobs %}<article><h2><a href="{{ site_url }}/seo/jobs/{{ job.slug }}/">{{ job.title }}</a></h2><p>{{ job.company.name }} · {{ job.location }} · {{ job.get_job_type_display }}</p><p>{{ job.description|truncatechars:220 }}</p></article>{% empty %}<p>No active jobs are available right now.</p>{% endfor %}</main></body></html>
